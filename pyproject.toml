[tool.basedpyright]
# Strict typing covers the whole pipeline package by default, so new pure helpers
# are checked without being added to an allowlist. The ROS node shells are excluded
# because rclpy parameters and generated message fields currently surface many
# Unknown types under strict mode; the pure logic they call is still checked.
include = [
  "src/eeg_bci_pipeline/eeg_bci_pipeline",
]
exclude = [
  "**/__pycache__",
  ".venv",
  "build",
  "install",
  "log",
  "src/eeg_bci_pipeline/eeg_bci_pipeline/mock_eeg_publisher.py",
  "src/eeg_bci_pipeline/eeg_bci_pipeline/gdf_replay_publisher.py",
  "src/eeg_bci_pipeline/eeg_bci_pipeline/mock_intent_decoder.py",
  "src/eeg_bci_pipeline/eeg_bci_pipeline/model_intent_decoder.py",
  "src/eeg_bci_pipeline/eeg_bci_pipeline/intent_marker_publisher.py",
]
extraPaths = ["src/eeg_bci_pipeline"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = [
  "build",
  "install",
  "log",
]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
