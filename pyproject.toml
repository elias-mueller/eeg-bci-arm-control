[tool.basedpyright]
# The whole pipeline package is type-checked. Pure modules run under strict mode
# (the default below); the rclpy node shells carry a per-file "# pyright: basic"
# header because rclpy and the generated message classes are only partially typed,
# so strict floods them with reportUnknown* noise. Basic still catches real
# mistakes (undefined names, bad calls, argument-type errors), and the editor LSP
# honors the same header, so new pure helpers stay strict by default.
include = [
  "src/eeg_bci_pipeline/eeg_bci_pipeline",
]
exclude = [
  "**/__pycache__",
  ".venv",
  "build",
  "install",
  "log",
]
extraPaths = ["src/eeg_bci_pipeline"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = [
  "build",
  "install",
  "log",
]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
# Measure only the pipeline package; tests, launch files, and build/install
# artifacts are outside it and so are not counted.
source = ["eeg_bci_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
fail_under = 100
exclude_lines = [
  # Lines marked as intentionally-untested wiring (rclpy main() spin loops and
  # optional-dependency import guards carry a per-line "# pragma: no cover").
  "pragma: no cover",
  # Script entry points and type-only blocks never run under pytest.
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  # Structural-typing Protocols are shapes for the type checker; their method
  # bodies (``...``) carry no runtime behavior and are never executed.
  "class .*\\bProtocol\\b.*:",
]

[tool.coverage.html]
directory = "tmp/coverage_html"
